*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
  min-height:100dvh; transition:background-color .35s ease;
}
#bgLayer{
  position:fixed; inset:0; z-index:-2; background-image:var(--bg-img);
  background-size:cover; background-position:var(--bg-pos);
  opacity:var(--bg-op); filter:blur(var(--bg-blur)); transition:opacity .35s ease;
}
#bgTint{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:var(--tint, linear-gradient(180deg, rgba(0,0,0,.52) 0%, rgba(0,0,0,.16) 20%, rgba(6,12,20,.60) 52%, var(--bg) 84%));
  transition:background .35s ease;
}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--ink-2)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.hidden{display:none !important}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* ══════════ 랜딩 ══════════ */
#home{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:26px}
.lg-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:calc(22px + env(safe-area-inset-top)) 0 0;
}
.lg{display:inline-flex;align-items:center}
.lg.pone img{height:36px;width:auto;object-fit:contain}
.lg.forest img{height:46px;width:auto;object-fit:contain}
.lg b{
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  letter-spacing:.20em;color:var(--ink-2);
}
.lg b{
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  letter-spacing:.20em;color:var(--ink-2);
}
.lg-row .x{color:var(--ink-3);font-size:12px;font-weight:400}

.hero{text-align:center;padding:20px 0 4px}
.hero h1{font-size:34px;font-weight:700;margin:0;letter-spacing:-.03em;line-height:1.15}
.hero .when{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:10px;font-size:13.5px;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;
}
.hero .dday{
  background:var(--accent-soft);border:1px solid var(--line-2);color:var(--accent);
  padding:3px 11px;border-radius:999px;font-weight:500;font-size:13px;letter-spacing:.04em;
}
body:not([data-theme]) .hero .dday{color:var(--accent)}

.phase{
  margin:20px 0 0;border-radius:14px;padding:13px 16px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
}
.phase .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
.phase .pip{
  width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 0 0 var(--accent-soft);animation:pulse 2.6s infinite;
}
.phase.off .pip{background:var(--ink-3);animation:none;box-shadow:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.phase .s{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.6}
.phase .s b{color:var(--accent);font-weight:600;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.phase .pip{animation:none}}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:auto 0 0;padding-top:26px}
.pcard{
  background:none;border:0;padding:0;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:10px;
}
.pcard .cap{display:flex;flex-direction:column;gap:2px}
.pcard .pw{
  position:relative;border-radius:11px;overflow:hidden;aspect-ratio:1414/2000;
  border:1px solid var(--line-2);background:var(--panel-2);
  box-shadow:0 10px 26px -14px rgba(0,0,0,.9);
  transition:transform .18s ease, box-shadow .18s ease;
}
.pcard:active .pw{transform:scale(.97)}
.pcard .pw img{width:100%;height:100%;object-fit:cover}
.pcard .so{
  position:absolute;inset:0;background:rgba(6,10,14,.72);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;letter-spacing:.14em;color:#fff;
  backdrop-filter:saturate(.2) blur(1px);
}
.pcard .nm{font-size:12.5px;font-weight:600;line-height:1.35;letter-spacing:-.02em;margin:0}
.pcard .pl{font-size:11px;color:var(--ink-3);margin:0;font-family:"IBM Plex Mono",monospace}
.tapHint{text-align:center;font-size:12px;color:var(--ink-3);margin:16px 0 auto}

.foot{padding-top:26px;text-align:center;font-size:11.5px;color:var(--ink-3);line-height:2}
.foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}

/* ══════════ 포스터 전체화면 ══════════ */
#poster{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column}
#poster .px{
  position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:3;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);
  background:rgba(0,0,0,.45);color:var(--ink);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
#poster .pf{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:52px 16px 8px}
#poster .pf img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.9)}
.pbar{
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 46%);
}
.pbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.pbar .meta{flex:1;min-width:0}
.pbar .meta .n{font-size:17px;font-weight:700;margin:0;letter-spacing:-.015em}
.pbar .meta .m{font-size:12px;color:var(--ink-3);margin:2px 0 0;font-family:"IBM Plex Mono",monospace}

/* ══════════ 공통 버튼 ══════════ */
.btn{
  min-height:52px;border:0;border-radius:13px;padding:0 22px;
  background:var(--accent);color:var(--accent-ink);
  font-size:16px;font-weight:700;letter-spacing:-.01em;cursor:pointer;
  transition:opacity .15s, transform .12s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--line-2);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line-2);flex:0 0 auto;font-weight:600}
.btn.full{width:100%}

/* ══════════ 폼 ══════════ */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;
}
.topbar .row{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;padding:0 18px}
.back{background:none;border:0;color:var(--ink-2);font-size:15px;padding:8px;margin-left:-8px;
  min-height:var(--tap);display:flex;align-items:center;cursor:pointer}
.topbar .ttl{font-size:15px;font-weight:600;flex:1}
.prog{height:2px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .28s ease}

#form{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.step{padding:24px 0 0}
.step h2{font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
.step .lead{color:var(--ink-3);font-size:13.5px;margin:0 0 22px;line-height:1.7}

.field{margin-bottom:18px}
label.lb{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
label.lb .must{color:var(--alert);margin-left:3px}
.hint{font-size:12px;color:var(--ink-3);margin:7px 0 0;line-height:1.6}
input[type=text],input[type=tel],input[type=number],select,textarea{
  width:100%;min-height:var(--tap);padding:12px 14px;border-radius:11px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);appearance:none;
}
textarea{min-height:88px;resize:vertical;line-height:1.6}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C90A6' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:40px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--line-2);box-shadow:0 0 0 3px var(--accent-soft)}

.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  position:relative;display:flex;align-items:center;gap:11px;min-height:var(--tap);
  padding:12px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel-2);cursor:pointer;font-size:15px;transition:border-color .12s,background .12s;
}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;position:relative}
.opt .mk::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .12s}
.opt.chk .mk{border-radius:6px}
.opt:has(input:checked),.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .mk,.opt.on .mk{border-color:var(--accent)}
.opt:has(input:checked) .mk::after,.opt.on .mk::after{opacity:1}
.opt.chk:has(input:checked) .mk::after,.opt.chk.on .mk::after{inset:3px;border-radius:2px}
.opt[aria-disabled=true]{opacity:.38;cursor:not-allowed}
.opt .main{flex:1}
.opt .sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;font-family:"IBM Plex Mono",monospace}
.opt .tag{font-size:11px;font-family:"IBM Plex Mono",monospace;color:var(--ink-3);flex:none;letter-spacing:.06em}
.opt .tag.full{color:var(--alert)}

.mbox{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;background:var(--panel-2)}
.mbox .mh{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:13px;letter-spacing:.02em}
.mbox .field:last-child{margin-bottom:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.terms{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);margin-bottom:11px}
.terms summary{padding:13px 15px;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:var(--tap);display:flex;align-items:center}
.terms .in{padding:0 15px 15px;font-size:12.5px;color:var(--ink-3);line-height:1.8}
.terms .in p{margin:0 0 9px}
.terms .in b{color:var(--ink-2)}

.summary{border:1px solid var(--line-2);border-radius:15px;background:var(--panel);padding:17px;margin-bottom:18px;backdrop-filter:blur(8px)}
.summary .r{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13.5px;color:var(--ink-3)}
.summary .r b{color:var(--ink);font-weight:600;text-align:right}
.summary .tot{border-top:1px solid var(--line);margin-top:9px;padding-top:13px;display:flex;justify-content:space-between;align-items:baseline}
.summary .tot span{font-size:13.5px;color:var(--ink-2)}
.summary .tot b{font-size:26px;font-weight:700;color:var(--accent);font-family:"IBM Plex Mono",monospace}
.disc{font-size:12px;color:var(--ink-2);margin-top:7px;text-align:right}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(180deg,transparent,var(--bg) 26%);
  padding:18px 18px calc(16px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bar .in .btn:not(.ghost){flex:1}

.msg{border-radius:11px;padding:12px 15px;font-size:13px;margin-bottom:16px;display:none;line-height:1.65}
.msg.show{display:block}
.msg.err{background:var(--accent-soft);border:1px solid var(--alert);color:var(--ink)}
.msg.warn{background:var(--panel);border:1px solid var(--line-2);color:var(--ink-2)}
.msg a{color:var(--accent)}

/* ══════════ 완료 ══════════ */
#done{padding-bottom:40px}
.done{text-align:center;padding:calc(40px + env(safe-area-inset-top)) 0 8px}
.done .ck{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.done .ck svg{width:28px;height:28px;stroke:var(--accent);stroke-width:2.6;fill:none}
.done h2{font-size:23px;margin:0 0 6px;letter-spacing:-.02em}
.done .no{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3)}
.pay{border:1px solid var(--line-2);border-radius:16px;background:var(--panel);padding:18px;margin:24px 0 16px;backdrop-filter:blur(8px)}
.pay .hd{font-size:11px;color:var(--ink-3);margin:0 0 13px;font-family:"IBM Plex Mono",monospace;letter-spacing:.14em}
.copy{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
  min-height:var(--tap);padding:12px 14px;border-radius:11px;background:var(--panel-2);
  border:1px solid var(--line);margin-bottom:9px;cursor:pointer;text-align:left}
.copy .k{font-size:12px;color:var(--ink-3);flex:none}
.copy .v{font-size:15.5px;font-weight:600;font-family:"IBM Plex Mono",monospace;flex:1;text-align:right;word-break:break-all}
.copy .ic{font-size:10.5px;color:var(--accent);flex:none;font-family:"IBM Plex Mono",monospace}
.deadline{background:var(--accent-soft);border:1px solid var(--line-2);border-radius:12px;padding:13px 15px;margin-top:14px}
.deadline .l{font-size:11.5px;color:var(--ink-2);margin:0 0 3px}
.deadline .v{font-size:18px;font-weight:700;font-family:"IBM Plex Mono",monospace;margin:0;color:var(--accent)}
.note-sm{font-size:12px;color:var(--ink-3);line-height:1.85;margin:15px 0 0}

.skel{background:linear-gradient(90deg,var(--panel-2),var(--panel),var(--panel-2));
  background-size:200% 100%;animation:sk 1.4s infinite;border-radius:6px;color:transparent}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
</style>
</head>

/* fetch 가 막히는 환경(일부 인앱 브라우저·프록시·CORS)이 있어
   <script> 태그로 부르는 우회 경로를 함께 둔다. 이쪽은 브라우저가 막지 않는다. */
let LAST_ERR = '';
function jsonp(params, ms){
  return new Promise(function(resolve, reject){
    const cb = 'wtfl' + (JSONP_N++) + '_' + (Date.now() % 1000000);
    const sc = document.createElement('script');
    let done = false;
    function clean(){ try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
                      if(sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb] = function(data){ done = true; clean(); resolve(data); };
    sc.onerror = function(){ if(!done){ done = true; clean(); reject(new Error('LOAD')); } };
    const q = new URLSearchParams(params);
    q.set('callback', cb); q.set('t', String(Date.now()));
    sc.src = API_URL + '?' + q.toString();
    document.head.appendChild(sc);
    setTimeout(function(){ if(!done){ done = true; clean(); reject(new Error('TIMEOUT')); } }, ms || 25000);
  });
}
let JSONP_N = 0;

/* ═══════════════ 상태 ═══════════════ */
async function loadStatus(){
  let j = null;
  try{
    const r = await fetch(API_URL + '?action=status&t=' + Date.now());
    j = await r.json();
  }catch(e){
    LAST_ERR = 'GET:' + (e && e.message ? e.message : e);
    try{ j = await jsonp({ action:'status' }, 15000); LAST_ERR = ''; }
    catch(e2){ LAST_ERR += ' / JSONP:' + (e2 && e2.message ? e2.message : e2); j = null; }
  }
  // 응답 모양이 예상과 다르면(오류 페이지, 잘못된 URL 등) 상태 없음으로 처리.
  // 잘못 파싱된 값 때문에 '접수 마감'이 뜨는 사고를 막는다.
  STATUS = (j && j.ok === true && j.programs) ? j : null;
  renderPhase(); renderCards(); syncPlan();
}

/* 열려 있는 '타임 선택' 화면을 최신 마감 상태로 맞춘다.
   입력 중일 때는 건드리지 않고 다음 갱신으로 미룬다. */
function planSignature(){
  if(!S || !P[S.id]) return '';
  return Object.keys(P[S.id].times).map(function(t){ return seatFor(t).dis ? '1' : '0'; }).join('');
}
function syncPlan(){
  if(!S) return;
  const form = document.getElementById('form');
  if(form.classList.contains('hidden')) return;
  const list = stepsOf();
  if(list[Math.min(S.step, list.length - 1)] !== 'plan') return;
  const sig = planSignature();
  if(sig === planSig) return;
  const a = document.activeElement;
  if(a && form.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
  planSig = sig;
  if(S.time && seatFor(S.time).dis){
    S.time = 0;
    flash('선택하신 타임이 방금 마감되었습니다. 다른 타임을 골라주세요.');
  }
  render();
}

function renderDday(){
  const d = Math.ceil((parseKST(EVENT_DATE + ' 00:00') - Date.now()) / 86400000);
  const el = document.getElementById('dday');
  el.textContent = d > 0 ? 'D-' + d : (d === 0 ? 'D-DAY' : '종료');
}

function renderPhase(){
  const box = document.getElementById('phaseBox');
  const t = document.getElementById('phaseTitle');
  const s = document.getElementById('phaseSub');
  t.classList.remove('skel');
  if(!STATUS){
    box.classList.add('off');
    t.textContent = '접수 상태를 불러오지 못했습니다';
    s.textContent = '잠시 후 새로고침해 주세요.';
    return;
  }
  if(!STATUS.phase){
    box.classList.add('off');
    t.textContent = STATUS.phaseLabel || '접수 마감';
    s.textContent = '2차 접수는 9월 3일 00시에 열립니다.';
    return;
  }
  box.classList.remove('off');
  t.textContent = STATUS.phase + ' 접수 중';
  if(STATUS.discountActive){
    const left = timeLeft(STATUS.discountEndsAt);
    s.innerHTML = '공과대학 · 생활과학대학 학우 <b>1인당 1,000원 할인</b>' +
      (left ? '<br>할인 마감까지 <b>' + left + '</b>' : '');
  } else {
    s.textContent = '2차 접수 — 정가로 진행됩니다.';
  }
}
function timeLeft(str){
  const end = parseKST(str); if(!end) return null;
  const ms = end - Date.now(); if(ms <= 0) return null;
  const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000);
  return d > 0 ? d + '일 ' + h + '시간' : h + '시간';
}
function parseKST(v){
  if(!v) return 0;
  const m = String(v).replace(/\//g,'-').match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T]?(\d{1,2})?:?(\d{1,2})?/);
  if(!m) return 0;
  return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)).getTime();
}

/* ═══════════════ 랜딩 카드 ═══════════════ */
function renderCards(){
  const el = document.getElementById('cards');
  el.innerHTML = '';
  ORDER.forEach(function(id){
    const p = P[id];
    const out = isSoldOut(id);
    const c = document.createElement('button');
    c.className = 'pcard'; c.type = 'button';
    c.onclick = function(){ openPoster(id); };
    c.innerHTML =
      '<div class="pw"><img src="' + p.poster + '" alt="' + p.name + ' 포스터">' +
        (out ? '<span class="so">마감</span>' : '') + '</div>' +
      '<div class="cap"><p class="nm">' + p.short + '</p>' +
      '<p class="pl">' + p.venue + '</p></div>';
    el.appendChild(c);
  });
}

/** 전 타임·전 성별이 0일 때만 마감 */
function isSoldOut(id){
  if(!STATUS || !STATUS.programs) return false;
  if(id === 'min72'){
    const d = STATUS.programs['72분_미팅'] || {};
    const keys = Object.keys(d); if(!keys.length) return false;
    return keys.every(function(t){
      const x = d[t];
      return x.pair['여'] <= 0 && x.pair['남'] <= 0 &&
             x.trio['여'] <= 0 && x.trio['남'] <= 0 && x.general.tables <= 0;
    });
  }
  const d = STATUS.programs[id === 'solo' ? '솔로파티' : '로테이션'] || {};
  const keys = Object.keys(d); if(!keys.length) return false;
  return keys.every(function(t){ return d[t]['여'] <= 0 && d[t]['남'] <= 0; });
}

function openPoster(id){
  const p = P[id];
  pendingId = id;
  setTheme(p.theme);
  document.getElementById('pImg').src = p.poster;
  document.getElementById('pImg').alt = p.name + ' 포스터';
  document.getElementById('pName').textContent = p.name;
  document.getElementById('pMeta').textContent = p.place + ' · ' + priceText(p);
  const go = document.getElementById('pGo');
  const out = isSoldOut(id);
  go.disabled = out;
  go.textContent = out ? '마감되었습니다' : '신청하기';
  show('poster');
}
function priceText(p){
  const on = !!(STATUS && STATUS.discountActive);
  const k = function(n){ return Number(n).toLocaleString('ko-KR') + '원'; };
  if(p.key === '72분_미팅') return '미팅 ' + k(on ? p.feeD : p.fee) + ' / 단체석 ' + k(on ? p.gfeeD : p.gfee);
  return k(on ? p.feeD : p.fee);
}
function setTheme(t){
  if(t) document.body.setAttribute('data-theme', t);
  else document.body.removeAttribute('data-theme');
}

  host.innerHTML = '';
  host.appendChild(({ plan:stPlan, leader:stLeader, members:stMembers, extra:stExtra, confirm:stConfirm })[list[cur]]());
  renderNav(list, cur);
  saveDraft();
}
function renderNav(list, cur){
  const nav = document.getElementById('navBar');
  nav.innerHTML = '';
  if(cur > 0){
    const b = document.createElement('button');
    b.className='btn ghost'; b.type='button'; b.textContent='이전';
    b.onclick = function(){ S.step--; render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  }
  const n = document.createElement('button');
  n.className='btn'; n.type='button';
  n.textContent = (cur === list.length-1) ? '신청 완료하기' : '다음';
  n.onclick = function(){ next(list, cur); };
  nav.appendChild(n);
}
async function next(list, cur){
  if(navBusy) return;
  if(list[cur] === 'plan'){
    navBusy = true;
    const btn = document.querySelector('#navBar .btn:not(.ghost)');
    const label = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = '확인 중…'; }
    await loadStatus();
    if(btn){ btn.disabled = false; btn.textContent = label; }
    navBusy = false;
  }
  const err = validateStep(list[cur]);
  if(err){ flash(err); return; }
  clearMsg();
  if(cur === list.length-1){ submit(); return; }
  S.step++; render(); window.scrollTo(0,0);
}
function flash(m){
  const el = document.getElementById('formMsg');
  el.textContent = m; el.className = 'msg err show';
  window.scrollTo({top:0, behavior:'smooth'});
}
function clearMsg(){ document.getElementById('formMsg').className = 'msg err'; }

/** 마감일 때만 표시 — 잔여 숫자는 노출하지 않음 */
function seatFor(t){
  if(!STATUS || !STATUS.programs) return { text:'', cls:'', dis:false };
  let n = 1;
  if(S.id === 'min72'){
    const d = (STATUS.programs['72분_미팅']||{})[t];
    if(!d) return { text:'', cls:'', dis:false };
    n = (S.track === 'general') ? d.general.maxHeadcount
      : ((S.headcount === 3 ? d.trio : d.pair)[S.gender] || 0);
    if(S.track === 'general' && S.headcount > 0 && n > 0 && n < S.headcount){
      return { text:'최대 ' + n + '명', cls:'full', dis:false };
    }
  } else {
    const d = (STATUS.programs[S.id === 'solo' ? '솔로파티' : '로테이션']||{})[t];
    if(!d) return { text:'', cls:'', dis:false };
    n = d[S.gender] || 0;
  }
  return n <= 0 ? { text:'마감', cls:'full', dis:true } : { text:'', cls:'', dis:false };
}

  const p = P[S.id];

  d.appendChild(el('<p class="lead">제출 후에는 수정이 어렵습니다. 한 번만 확인해 주세요.</p>'));

  const s = el('<div class="summary"></div>');
  const rows = [
    ['프로그램', p.short + (S.id==='min72' ? (S.track==='general' ? ' · 단체석' : ' · 미팅') : '')],
    ['타임', S.time + '타임 (' + p.times[S.time] + ')'],
    ['인원', S.headcount + '명' + (S.gender && S.gender!=='혼성' ? ' · ' + S.gender + '성 팀' : '')],
    ['대표자', S.leader.name + ' · ' + S.leader.dept],
    ['연락처', dash(S.leader.phone)],
    ['입금자명', S.depositName || S.leader.name]
  ];
  if(S.members.length) rows.push(['팀원', S.members.map(function(m){ return m.name; }).join(', ')]);
  rows.forEach(function(r){ s.appendChild(el('<div class="r"><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>')); });
  s.appendChild(el('<div class="tot"><span>참가비 합계</span><b>' + won(fee.total) + '</b></div>'));
  if(fee.discountCount > 0){
    s.appendChild(el('<p class="disc">공생 할인 ' + fee.discountCount + '명 적용 (−' + won(fee.discountCount*1000) + ')</p>'));
  }
  d.appendChild(s);
  d.appendChild(el('<p class="hint">신청 완료 후 안내되는 계좌로 <b style="color:var(--accent)">10분 이내</b> 입금하셔야 자리가 확정됩니다.</p>'));
  return d;
}

function calcFee(){
  const p = P[S.id];
  const on = !!(STATUS && STATUS.discountActive);
  const isGen = (S.id === 'min72' && S.track === 'general');
  const reg = isGen ? p.gfee : p.fee, dis = isGen ? p.gfeeD : p.feeD;
  if(isGen){
    const g = on ? Math.min(Math.max(0, S.gongsaengCount), S.headcount) : 0;
    return { total: g*dis + (S.headcount-g)*reg, discountCount:g };
  }
  let total = 0, n = 0;
  [S.leader].concat(S.members).forEach(function(m){
    if(on && GONGSAENG.indexOf(m.college) >= 0){ total += dis; n++; } else total += reg;
  });
  return { total:total, discountCount:n };
}

/* ── 검증 ── */
function validateStep(name){
  if(name === 'plan'){
    if(S.id === 'min72' && !S.track) return '참여 방식을 선택해 주세요.';
    if(S.id === 'min72' && S.track === 'general'){
      if(S.headcount < 3 || S.headcount > 18) return '단체석은 3명 이상 18명 이하로 신청할 수 있습니다.';
      if(S.gongsaengCount > S.headcount) return '공과대학·생활과학대학 인원이 전체 인원보다 많습니다.';
    } else if(!S.gender) return '팀 성별을 선택해 주세요.';
    if(S.id === 'rota'){
      if(!S.grades[0] || !S.grades[1]) return '두 분의 학년을 모두 선택해 주세요.';
      S.leader.grade = S.grades[0];
      syncMembers();
      if(S.members[0]) S.members[0].grade = S.grades[1];
    }
    if(!S.time) return '참여 타임을 선택해 주세요.';
    if(seatFor(S.time).dis) return '선택하신 타임은 마감되었습니다. 다른 타임을 골라주세요.';
    return null;
  }
  if(name === 'leader'){
    const e = checkM(S.leader, '대표자'); if(e) return e;
    if(!(S.depositName || S.leader.name).trim()) return '입금자명을 입력해 주세요.';
    return null;
  }
  if(name === 'members'){
    for(var i=0;i<S.members.length;i++){
      const e = checkM(S.members[i], '팀원 ' + (i+2)); if(e) return e;
    }
    if(!S.agreeMembers) return '팀원 동의 확인에 체크해 주세요.';
    return null;
  }
  if(name === 'extra'){
    if(S.id === 'solo' && !S.mood) return '팀 분위기를 선택해 주세요.';
    if(S.id === 'rota' && !S.intro.trim()) return '자기소개를 입력해 주세요.';
    if(!S.agreePrivacy) return '개인정보 수집·이용에 동의해 주세요.';
    if(!S.agreeRefund)  return '취소·환불 규정 확인에 체크해 주세요.';
    return null;
  }
  return null;
}
function checkM(m, who){
  if(!m.name.trim())    return who + ' 이름을 입력해 주세요.';
  if(!m.college)        return who + ' 단과대를 선택해 주세요.';
  if(!m.dept.trim())    return who + ' 학과를 입력해 주세요.';
  if(!m.sid)            return who + ' 학번을 선택해 주세요.';
  const by = String(m.birth || '');
  if(!/^[0-9]{4}$/.test(by) || +by < 1960 || +by > 2012) return who + ' 생년을 확인해 주세요. (예: 2004)';
  if(!/^01[016789][0-9]{7,8}$/.test(m.phone)) return who + ' 연락처를 확인해 주세요.';
  return null;
}

/* ── 제출 ── */
async function submit(){
  const btns = document.querySelectorAll('#navBar .btn');
  btns.forEach(function(b){ b.disabled = true; });
  const main = document.querySelector('#navBar .btn:not(.ghost)');
  if(main) main.textContent = '접수 중…';

  const body = new URLSearchParams();
  const isGen = (S.id === 'min72' && S.track === 'general');
  body.set('program', isGen ? '72분_일반' : P[S.id].key);
  body.set('track', S.id === 'min72' ? (isGen ? '일반' : '미팅') : '');
  body.set('time', S.time);
  if(S.time2) body.set('time2', S.time2);
  body.set('gender', isGen ? '혼성' : S.gender);
  body.set('headcount', S.headcount);
  body.set('gongsaengCount', S.gongsaengCount || 0);
  ['name','birth','college','dept','sid','grade','phone'].forEach(function(k){ body.set(k, S.leader[k]); });
  body.set('members', JSON.stringify(S.members));
  body.set('depositName', S.depositName || S.leader.name);
  body.set('teamName', S.teamName);
  body.set('mood', S.mood); body.set('avoid', S.avoid); body.set('item', S.item);
  body.set('intro', S.intro);
  body.set('agreePrivacy', S.agreePrivacy); body.set('agreeRefund', S.agreeRefund);
  body.set('agreeMembers', S.agreeMembers);

  let res = null, why = '';
  for(var attempt = 0; attempt < 2 && !res; attempt++){
    try{
      const r = await fetch(API_URL, { method:'POST', body: body });
      res = await r.json();
    }catch(e){ why = 'POST:' + (e && e.message ? e.message : e); }
  }
  if(!res){                                  // POST 가 막히면 <script> 우회로로 한 번 더
    try{
      const q = new URLSearchParams(body); q.set('action', 'submit');
      res = await jsonp(q, 30000);
    }catch(e){ why += ' / JSONP:' + (e && e.message ? e.message : e); }
  }
  if(!res){ res = { ok:false, code:'NET' }; LAST_ERR = why; }
  btns.forEach(function(b){ b.disabled = false; });
  if(main) main.textContent = '신청 완료하기';

  if(!res || !res.ok){
    if(res && res.status){ STATUS = res.status; renderCards(); }
    if(res && res.code === 'FULL'){
      S.time = 0; S.step = 0; planSig = planSignature();
      render(); window.scrollTo(0,0);
    }
    flash((res && res.message) ||
      ('전송에 실패했습니다. 네트워크를 확인하고 다시 시도해 주세요. 계속 실패하면 인스타 DM으로 연락 주세요.' +
       (LAST_ERR ? '  [' + LAST_ERR + ']' : '')));
    return;
  }
  clearDraft();
  showDone(res);
}

function showDone(r){
  document.getElementById('doneNo').textContent = '접수번호 ' + r.no;
  const rows = document.getElementById('payRows');
  rows.innerHTML = '';
  const acc = r.account || {};
  addCopy(rows, '입금 금액', won(r.fee), r.fee);
  if(acc.number && String(acc.number).trim()){
    addCopy(rows, '계좌' + (acc.bank ? ' · ' + acc.bank : ''), acc.number, String(acc.number).replace(/[^0-9]/g,''));
    addCopy(rows, '예금주', acc.holder || '');
  }else{
    rows.appendChild(el('<div class="copy"><span class="k">계좌</span>' +
      '<span class="v" style="font-size:13.5px;color:var(--ink-3)">준비 중 — 곧 문자로 안내드립니다</span></div>'));
  }
  addCopy(rows, '입금자명', r.depositName);
  document.getElementById('dueTime').textContent = r.dueFull + ' 까지';
  document.getElementById('doneNote').innerHTML =
    '· 기한 내 입금이 확인되지 않으면 접수가 자동 취소됩니다 (유예 ' + (r.graceMin||30) + '분).<br>' +
    '· 확정 안내는 <b>9월 9일</b>에 대표자 연락처로 발송됩니다.<br>' +
    (r.discountCount > 0 ? '· 공생 할인 ' + r.discountCount + '명 적용됨. 현장에서 학생증을 확인합니다.<br>' : '') +
    '· 팀원 전원에게 신청 안내 문자가 발송됩니다.';
  show('done'); window.scrollTo(0,0);
}
function addCopy(host, k, v, raw){
  const b = el('<button class="copy" type="button"><span class="k">'+esc(k)+'</span>' +
    '<span class="v">'+esc(v)+'</span><span class="ic">복사</span></button>');
  b.onclick = function(){
    const txt = (raw != null) ? String(raw) : String(v);
    navigator.clipboard && navigator.clipboard.writeText(txt);
    const ic = b.querySelector('.ic'); ic.textContent = '복사됨';
    setTimeout(function(){ ic.textContent = '복사'; }, 1500);
  };
  host.appendChild(b);
}

/* ═══════════════ UI 헬퍼 ═══════════════ */
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function won(n){ return Number(n).toLocaleString('ko-KR') + '원'; }
function dash(v){ const s=String(v||''); return s.length>7 ? s.slice(0,3)+'-'+s.slice(3,7)+'-'+s.slice(7) : s; }

function field(label, must, control, hint){
  const f = el('<div class="field"></div>');
  f.appendChild(el('<label class="lb">' + esc(label) + (must ? '<span class="must">*</span>' : '') + '</label>'));
  f.appendChild(control);
  if(hint) f.appendChild(el('<p class="hint">' + hint + '</p>'));
  return f;
}
function inp(obj, key, ph){
  const i = el('<input type="text" placeholder="' + esc(ph||'') + '">');
  i.value = obj[key] || '';
  i.oninput = function(){ obj[key] = i.value; };
  return i;
}
function numInput(key, min, max, ph){
  const i = el('<input type="number" inputmode="numeric" min="'+min+'" max="'+max+'" placeholder="'+ph+'">');
  i.value = S[key] || (key === 'gongsaengCount' ? 0 : '');
  i.oninput = function(){ S[key] = +i.value || 0; };
  return i;
}
function sel(obj, key, list, ph){
  const s = el('<select></select>');
  s.appendChild(el('<option value="">' + esc(ph) + '</option>'));
  list.forEach(function(v){
    const o = el('<option></option>'); o.value = v; o.textContent = v;
    if(obj[key] === v) o.selected = true;
    s.appendChild(o);
  });
  s.onchange = function(){ obj[key] = s.value; };
  return s;
}
function birthSel(m){
  const wrap = el('<div></div>');
  const cur = String(m.birth || '');
  const custom = cur !== '' && BIRTH_YEARS.indexOf(cur) < 0;
  const s = el('<select></select>');
  s.appendChild(el('<option value="">선택</option>'));
  BIRTH_YEARS.forEach(function(v){
    const o = el('<option></option>'); o.value = v; o.textContent = v + '년생';
    if(cur === v) o.selected = true;
    s.appendChild(o);
  });
  const etc = el('<option value="__etc">그 외 — 직접 입력</option>');
  if(custom) etc.selected = true;
  s.appendChild(etc);
  const i = el('<input type="tel" inputmode="numeric" maxlength="4" placeholder="예: 1999" style="margin-top:8px">');
  i.value = custom ? cur : '';
  i.style.display = custom ? 'block' : 'none';
  i.oninput = function(){
    i.value = i.value.replace(/[^0-9]/g,'').slice(0,4);
    m.birth = i.value;
  };
  s.onchange = function(){
    if(s.value === '__etc'){ m.birth = i.value || ''; i.style.display = 'block'; i.focus(); }
    else { m.birth = s.value; i.style.display = 'none'; }
  };
  wrap.appendChild(s); wrap.appendChild(i);
  return wrap;
}
function opts(name, rows, current, onPick, twoCol){
  const g = el('<div class="opts' + (twoCol && rows.length === 2 ? ' two' : '') + '"></div>');
  rows.forEach(function(r){
    const lb = el('<label class="opt"><input type="radio" name="' + name + '"><span class="mk"></span>' +
      '<span class="main">' + esc(r.t) + (r.s ? '<span class="sub">' + esc(r.s) + '</span>' : '') + '</span>' +
      (r.tag ? '<span class="tag ' + (r.tagCls||'') + '">' + esc(r.tag) + '</span>' : '') + '</label>');
    const i = lb.querySelector('input');
    i.value = r.v;
    if(String(current) === String(r.v)) i.checked = true;
    if(r.dis){ i.disabled = true; lb.setAttribute('aria-disabled','true'); }
    lb.classList.toggle('on', i.checked);
    i.onchange = function(){
      g.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('on'); });
      lb.classList.add('on'); onPick(r.v);
    };
    g.appendChild(lb);
  });
  return g;
}
function chk(key, text){
  const lb = el('<label class="opt chk"><input type="checkbox"><span class="mk"></span>' +
    '<span class="main">' + esc(text) + '</span></label>');
  const i = lb.querySelector('input');
  i.checked = !!S[key]; lb.classList.toggle('on', i.checked);
  i.onchange = function(){ S[key] = i.checked; lb.classList.toggle('on', i.checked); };
  return lb;
}
function terms(title, html){
  return el('<details class="terms"><summary>' + esc(title) + ' 보기</summary><div class="in">' + html + '</div></details>');
}
/* ═══════════════ 임시 저장 ═══════════════ */
function saveDraft(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({ at:Date.now(), s:S })); }catch(e){} }
function loadDraft(id){
  try{
    const raw = localStorage.getItem(LS_KEY); if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || !o.s || o.s.id !== id) return null;
    if(Date.now() - o.at > 6*3600*1000) return null;
    restored = true;
    return o.s;
  }catch(e){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }

document.getElementById('pGo').onclick = function(){ if(pendingId) startForm(pendingId); };
document.getElementById('btnBack').onclick = function(){

/* ═══════════════ 진단 (주소 뒤에 ?diag 를 붙이면 열린다) ═══════════════ */
function openDiag(){
  const box = el('<div style="position:fixed;inset:0;z-index:99;background:#0B0E12;color:#DDE4EC;' +
    'padding:calc(16px + env(safe-area-inset-top)) 14px 24px;overflow:auto;' +
    'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.75"></div>');
  box.appendChild(el('<div style="font-size:15px;font-weight:700;margin-bottom:12px">연결 진단</div>'));
  const out = el('<pre id="diagOut" style="white-space:pre-wrap;word-break:break-all;margin:0"></pre>');
  box.appendChild(out);
  document.body.appendChild(box);
  diagRun(out);
}
async function diagRun(out){
  const L = [];
  function put(t){ L.push(t); out.textContent = L.join('\n'); }
  put('주소  ' + location.href);
  put('API   ' + API_URL);
  put('');

  try{
    const t = Date.now();
    const r = await fetch(API_URL + '?action=ping&x=' + t);
    const b = (await r.text()).slice(0, 160);
    put('1) fetch GET   HTTP ' + r.status + '  ' + (Date.now()-t) + 'ms');
    put('   ' + b);
  }catch(e){ put('1) fetch GET   실패: ' + (e && e.message ? e.message : e)); }
  put('');

  try{
    const t = Date.now();
    const j = await jsonp({ action:'ping' }, 15000);
    put('2) JSONP       ' + JSON.stringify(j).slice(0,160) + '  ' + (Date.now()-t) + 'ms');
  }catch(e){ put('2) JSONP       실패: ' + (e && e.message ? e.message : e)); }
  put('');

  try{
    const q = new URLSearchParams(); q.set('action','ping');
    const r = await fetch(API_URL, { method:'POST', body:q });
    const b = (await r.text()).slice(0, 160);
    put('3) fetch POST  HTTP ' + r.status);
    put('   ' + b);
  }catch(e){ put('3) fetch POST  실패: ' + (e && e.message ? e.message : e)); }
  put('');

  try{
    const r = await fetch(API_URL + '?action=status&x=' + Date.now());
    const j = await r.json();
    put('4) status      ok=' + j.ok + ' phase=' + j.phase + ' 프로그램=' + Object.keys(j.programs||{}).join(','));
  }catch(e){ put('4) status      실패: ' + (e && e.message ? e.message : e)); }
  put('');
  put('— 이 화면을 그대로 캡처해서 보내주세요 —');
}
if(location.search.indexOf('diag') >= 0) openDiag();

loadStatus();

document.addEventListener('visibilitychange', function(){
